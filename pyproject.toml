[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "culture-crash"
version = "0.1.0"
description = "Cultural Tension Engine: find pre-trends and collide them with far latent concepts."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "anthropic>=1.14,<2",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.6",
  "httpx>=0.27",
  "yt-dlp>=2025.1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
culture-crash = "culture_crash.cli:main"

[tool.setuptools]
packages = ["culture_crash"]

[tool.setuptools.package-data]
culture_crash = ["static/*"]
